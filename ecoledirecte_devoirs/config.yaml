name: "EcoleDirecte vers Discord"
version: "1.5.0"
slug: "ecoledirecte_devoirs"
description: "Envoie les devoirs et alertes de notes EcoleDirecte sur Discord, sur un planning configurable"
url: "https://github.com/turak/EcoleDirectHA"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:school-outline
panel_title: "EcoleDirecte"
map:
  - addon_config:rw
options:
  discord_webhook_url: ""
  school_zone: "B"
  students:
    - name: "Enfant"
      student_id: 0
  daily_time: "17:00"
  daily_send_sunday: true
  daily_send_monday: true
  daily_send_tuesday: true
  daily_send_wednesday: true
  daily_send_thursday: true
  daily_send_friday: false
  daily_send_saturday: false
  weekly_day: "sat"
  weekly_time: "12:00"
  grade_check_time: "17:00"
  grade_alert_fraction: 0.5
schema:
  discord_webhook_url: password
  school_zone: list(A|B|C|aucune)
  students:
    - name: str
      student_id: int
  daily_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  daily_send_sunday: bool
  daily_send_monday: bool
  daily_send_tuesday: bool
  daily_send_wednesday: bool
  daily_send_thursday: bool
  daily_send_friday: bool
  daily_send_saturday: bool
  weekly_day: list(mon|tue|wed|thu|fri|sat|sun)
  weekly_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  grade_check_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  grade_alert_fraction: float(0,1)
